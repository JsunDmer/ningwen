name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/ningwen.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/ningwen.jks" >> "$GITHUB_ENV"
          fi

      - name: Test & build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_PATH:-}" ]; then
            echo "KEYSTORE_PATH missing; refusing to publish an unsigned APK" >&2
            exit 1
          fi
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body: |
            ## 安装说明
            - 请直接覆盖安装，**不要先卸载**，否则本机记录会丢失。
            - 已安装用户：打开 App → 我的 → 检查更新 → 下载并安装。

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ningwen-apk
          path: app/build/outputs/apk/release/*.apk
